[package]
name = "engine-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bevy_ecs = { version = "=0.15.1", default-features = false }
glam = { version = "=0.29.3", features = ["serde"] }
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard = { version = "=1.1.3", features = ["alloc"] }
rmp-serde = { version = "=1.1.2" }
bincode = { version = "=1.3.3" }
ggrs = { version = "=0.11.0", optional = true }
rapier3d = { version = "=0.22.0", features = ["enhanced-determinism", "serde-serialize"] }
tokio = { version = "=1.47.1", features = ["rt-multi-thread", "sync", "time"] }
crossbeam-channel = { version = "=0.5.15" }
petgraph = { version = "=0.6.5" }
tracy-client = { version = "=0.18.0", optional = true }
ron = { version = "=0.8.1" }
anyhow = { version = "=1.0.98" }
# Phase 2 render graph (spec 03): wgpu portable base + Slang->WGSL->Naga triple.
# MSRV pins (Rust 1.82.0): indexmap/hashbrown/ahash constrain the resolver away
# from edition2024 transitives (hashbrown 0.17.x, moxcms 0.8.x); image is
# png-only to avoid heavy/MRSV-risky codecs. bevy_render 0.15 (wgpu 23 tree)
# is intentionally NOT linked in Phase 2 — the graph is bevy_render-compatible
# without forking the GPU closure (see shaders/COMPAT.md).
wgpu = { version = "=24.0.5", default-features = false, features = ["wgsl"] }
naga = { version = "=24.0.0", default-features = false, features = ["wgsl-in", "wgsl-out"] }
pollster = { version = "=0.3.0" }
image = { version = "=0.25.2", default-features = false, features = ["png"] }
image-compare = { version = "=0.4.2" }
indexmap = { version = "=2.6.0" }
hashbrown = { version = "=0.15.5" }
ahash = { version = "=0.8.11" }

[features]
default = ["rollback"]
rollback = ["dep:ggrs"]
light-2d = []
profile = ["dep:tracy-client"]

[dev-dependencies]
criterion = { version = "=0.5.1" }

[[bench]]
name = "ecs_sparse"
harness = false

[[bench]]
name = "tick_hash"
harness = false
