[workspace]
members = [
    "crates/engine-runtime",
    "crates/studio-cli",
    "crates/editor-shell",
    "crates/asset-hub",
    "crates/script-sandbox",
    "crates/mcp-gate",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.143" }
blake3 = { version = "=1.5.4" }
ron = { version = "=0.8.1" }
anyhow = { version = "=1.0.98" }
crossbeam-channel = { version = "=0.5.15" }
