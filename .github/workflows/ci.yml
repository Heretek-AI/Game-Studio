name: ci
on:
  push:
  pull_request:
jobs:
  slang-matrix:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned slangc 2025.12
        shell: bash
        run: bash tools/fetch-slang.sh
      - name: slangc entry point answers pin
        shell: bash
        run: tools/bin/slangc --version | grep -q 2025.12
