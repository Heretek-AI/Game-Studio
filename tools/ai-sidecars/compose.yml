# AI sidecars are loopback-only containers; never workspace dependencies (spec 00 P6).
# Phase 4: llama.cpp + Ollama over loopback OpenAI-compat HTTP (spec 05 §5).
# Models are BYOK via ${LLAMA_MODEL} (host path mounted at /models/, contents
# gitignored — no weight is committed); the engine never links these images.
#
# Tag notes (probed 2026-10-13, recorded in docs/perf/phase4.md):
# - spec 05 §5 pins llama.cpp `server-b6032`; that build tag is pruned
#   upstream, so we track `:server` pinned by digest (same server binary).
# - spec 05 §5 writes `ollama:0.11`; the registry carries `0.11.0`
#   (same release line, full semver).
services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:c789283572ba78c2699b8945a96e654c850f938a717883f2e6187a14adac698f
    command:
      - "-m"
      - "${LLAMA_MODEL}"
      - "--port"
      - "39010"
      - "--ctx-size"
      - "8192"
    ports:
      - "127.0.0.1:39010:39010"
    volumes:
      - "./models:/models:ro"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:39010/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        reservations:
          memory: 8G
  ollama:
    image: ollama/ollama:0.11.0
    ports:
      - "127.0.0.1:11434:11434"
